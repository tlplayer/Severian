[[snippet]]
id = "primitives.registered"
covers = ["primitive.boolean", "primitive.signed_integer", "primitive.unsigned_integer", "primitive.floating_point", "primitive.text_and_storage", "primitive.measured"]
source = '''
def primitive_surface(
    signed: i128,
    unsigned: u128,
    low: f8e4m3fn,
    brain: bf16,
    wide: f128,
    text: string,
    raw: bytes,
    elapsed: duration,
) -> bool:
    return signed >= 0 and unsigned >= 0 and text != "" and elapsed >= 0.0
'''
