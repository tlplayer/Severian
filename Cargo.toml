[workspace]
members = [
    # Universal semantic authority
    "compiler/universal",
    "compiler/target",
    "compiler/artifact",
    "compiler/runtime",

    # CompileType dispatch and custom compiler integration
    "compiler/compile",
    "library/compute/tensor/compiler",

    # Language bootstrap
    "compiler/bootstrap",
    "library/core/compile",

    # Boundaries
    "compiler/boundaries/abi",
    "compiler/boundaries/backend",
    "compiler/boundaries/driver",
    "compiler/boundaries/ffi",
    "compiler/boundaries/interface",
    "compiler/boundaries/tokenizer",
    "compiler/boundaries/tensor-jit-provider",
    "compiler/boundaries/triton",
    "compiler/boundaries/xxi",

    # Cross-cutting
    "compiler/diagnostics",

    # Frontend
    "compiler/frontend/ast",
    "compiler/frontend/hir",
    "compiler/frontend/lexer",
    "compiler/frontend/modules",
    "compiler/frontend/ownership",
    "compiler/frontend/parser",
    "compiler/frontend/semantic",
    "compiler/source",

    # Transforms
    "compiler/transforms/fusion",
    "compiler/transforms/lir",
    "compiler/transforms/lowering",
    "compiler/transforms/mir",
    "compiler/transforms/mlir",
]
resolver = "2"

[workspace.package]
edition = "2021"
license-file = "LICENSE.md"
repository = "https://github.com/tlplayer/Severian"
version = "0.1.0"

[workspace.lints.rust]
dead_code = "deny"
unreachable_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
match_same_arms = "deny"
if_same_then_else = "deny"
needless_match = "deny"
branches_sharing_code = "warn"

# Package classifications are descriptive. Exact package allowlists below are
# authoritative and fail closed for every new production dependency.
[workspace.metadata.architecture.packages]
severian-source = "source"
severian-diagnostics = "diagnostics"
severian-lexer = "syntax"
severian-ast = "syntax"
severian-parser = "syntax"
severian-modules = "semantic"
severian-universal = "universal"
severian-target = "target"
severian-compile = "compile"
severian-artifact = "artifact"
severian-runtime = "runtime"
severian-compile-protocol = "core_source"
severian-hir = "semantic"
severian-semantic = "semantic"
severian-ownership = "semantic"
severian-bootstrap = "bootstrap"
severian-fusion = "transform"
severian-mir = "transform"
severian-lir = "transform"
severian-lowering = "transform"
severian-abi = "boundary"
severian-ffi = "boundary"
severian-interface = "boundary"
severian-tokenizer-provider = "boundary"
severian-tensor-jit-provider = "boundary"
severian-triton = "boundary"
severian-backend = "boundary"
severian-xxi = "boundary"
severian-mlir = "boundary"
severian-driver = "driver"
severian-tensor-compiler = "library_compiler"

[workspace.metadata.architecture.allow]
severian-source = []
severian-diagnostics = ["severian-source"]
severian-lexer = ["severian-diagnostics", "severian-source"]
severian-ast = ["severian-source"]
severian-parser = [
    "severian-ast",
    "severian-diagnostics",
    "severian-lexer",
    "severian-source",
]
severian-modules = [
    "severian-ast",
    "severian-diagnostics",
    "severian-lexer",
    "severian-parser",
    "severian-source",
]
severian-universal = []
severian-target = []
severian-compile = [
    "severian-artifact",
    "severian-mir",
    "severian-mlir",
    "severian-target",
    "severian-tensor-jit-provider",
    "severian-triton",
    "severian-universal",
]
severian-artifact = []
severian-runtime = ["severian-fusion"]
severian-compile-protocol = []
severian-hir = ["severian-source", "severian-universal"]
severian-semantic = [
    "severian-ast",
    "severian-diagnostics",
    "severian-hir",
    "severian-modules",
    "severian-source",
    "severian-universal",
]
severian-ownership = ["severian-diagnostics", "severian-hir"]
severian-bootstrap = [
    "severian-ast",
    "severian-diagnostics",
    "severian-lexer",
    "severian-parser",
    "severian-compile-protocol",
    "severian-source",
    "severian-universal",
]
severian-fusion = []
severian-mir = ["severian-artifact", "severian-hir", "severian-universal"]
severian-lir = ["severian-artifact"]
severian-lowering = [
    "severian-artifact",
    "severian-lir",
    "severian-mir",
    "severian-target",
    "severian-universal",
]
severian-abi = ["severian-target"]
severian-ffi = ["severian-abi", "severian-universal"]
severian-interface = ["severian-universal"]
severian-tokenizer-provider = []
severian-tensor-jit-provider = [
    "severian-backend",
    "severian-fusion",
    "severian-mlir",
    "severian-runtime",
    "severian-target",
    "severian-tensor-compiler",
    "severian-triton",
]
severian-triton = ["severian-fusion", "severian-runtime"]
severian-backend = ["severian-lir", "severian-runtime"]
severian-xxi = [
    "severian-abi",
    "severian-ast",
    "severian-ffi",
    "severian-universal",
]
severian-mlir = ["severian-artifact", "severian-lir", "severian-target"]
severian-driver = [
    "severian-abi",
    "severian-ast",
    "severian-backend",
    "severian-bootstrap",
    "severian-compile",
    "severian-diagnostics",
    "severian-fusion",
    "severian-lexer",
    "severian-hir",
    "severian-modules",
    "severian-lowering",
    "severian-mir",
    "severian-mlir",
    "severian-ownership",
    "severian-parser",
    "severian-semantic",
    "severian-source",
    "severian-runtime",
    "severian-target",
    "severian-universal",
    "severian-xxi",
    "severian-tensor-compiler",
]
severian-tensor-compiler = [
    "severian-artifact",
    "severian-compile",
    "severian-fusion",
    "severian-mir",
    "severian-mlir",
    "severian-universal",
]

[[workspace.metadata.architecture.reject]]
from = "severian-ast"
to = "severian-universal"

[[workspace.metadata.architecture.reject]]
from = "severian-parser"
to = "severian-universal"

[[workspace.metadata.architecture.reject]]
from = "severian-universal"
to = "severian-ast"

[[workspace.metadata.architecture.reject]]
from = "severian-backend"
to = "severian-semantic"

[[workspace.metadata.architecture.reject]]
from = "severian-ast"
to = "severian-ffi"

[[workspace.metadata.architecture.reject]]
from = "severian-ffi"
to = "severian-ast"

[[workspace.metadata.architecture.reject]]
from = "severian-target"
to = "severian-abi"

[[workspace.metadata.architecture.reject]]
from = "severian-compile"
to = "severian-lowering"

[[workspace.metadata.architecture.reject]]
from = "severian-compile"
to = "severian-abi"

[[workspace.metadata.architecture.reject]]
from = "severian-compile"
to = "severian-ffi"
