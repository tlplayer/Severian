[package]
name = "tensor"
version = "0.1.0"
edition = "2026"
description = "Shape-aware tensor kernels and parallel execution policies"

[package.unsafe]
capabilities = ["native-abi"]
sources = ["src/lib.sev"]

[lib]
path = "src/lib.sev"

[package.metadata.library]
category = "numerics"
implementation = "source-and-compiler-contracts"
status = "experimental"

[package.metadata.compiler]
symbols = { X = "rankedMatmul" }

[package.metadata.compiler.fusion]
runtime-symbol = "__sev_fused_activations"
packing-bits = 4
max-chain = 16
operations = { relu = 1, fastSigmoid = 2, fastTanh = 3, gelu = 4, swish = 5 }
