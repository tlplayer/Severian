[package]
name = "model"
version = "0.1.0"
edition = "2026"
description = "Author-facing tensor operations for Severian models"

[lib]
path = "src/lib.sev"

[package.metadata.library]
category = "machine-learning"
implementation = "native"
status = "experimental"

[package.metadata.compiler]
symbols = { Relu = "reluList", FastSigmoid = "fastSigmoidList", FastTanh = "fastTanhList", Swish = "swishList", J = "jacobianList" }
graph-operations = { graphInput = "input", graphRelu = "relu", graphAdd = "add", graphMatmul = "matmul", runGraph = "run" }
