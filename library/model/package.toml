[package]
name = "model"
version = "0.1.0"
edition = "2026"
description = "Author-facing tensor operations for Severian models"

[package.unsafe]
capabilities = ["native-abi"]
sources = ["src/lib.sev"]

[lib]
path = "src/lib.sev"

[dependencies]
tensor = { path = "../tensor", version = "0.1.0" }

[package.metadata.library]
category = "machine-learning"
implementation = "native"
status = "experimental"

[package.metadata.compiler]
symbols = { Relu = "relu_list", FastSigmoid = "fast_sigmoid_list", FastTanh = "fast_tanh_list", Swish = "swish_list", J = "jacobian_list" }
fusion-aliases = { relu_list = "tensor.relu", fast_sigmoid_list = "tensor.fast_sigmoid", fast_tanh_list = "tensor.fast_tanh", swish_list = "tensor.swish" }
graph-operations = { graph_input = "input", graph_relu = "relu", graph_add = "add", graph_matmul = "matmul", run_graph = "run" }
