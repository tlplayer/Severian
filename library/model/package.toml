[package]
name = "model"
version = "0.1.0"
edition = "2026"
description = "Author-facing tensor operations for Severian models"

[package.unsafe]
capabilities = ["native-abi"]
sources = ["src/lib.sev"]

[lib]
path = "src/lib.sev"

[dependencies]
audio = { path = "../audio", version = "0.1.0" }
file = { path = "../file", version = "0.1.0" }
hash = { path = "../hash", version = "0.1.0" }
http = { path = "../http", version = "0.1.0" }
json = { path = "../json", version = "0.1.0" }
math = { path = "../math", version = "0.1.0" }
neuralnet = { package = "model.neuralnet", path = "neuralnet", version = "0.1.0" }
path = { path = "../path", version = "0.1.0" }
platform = { path = "../platform", version = "0.1.0" }
qwen = { package = "model.architectures.qwen", path = "architectures/qwen", version = "0.1.0" }
random = { path = "../random", version = "0.1.0" }
tensor = { path = "../tensor", version = "0.1.0" }

[package.metadata.library]
category = "machine-learning"
implementation = "native"
status = "experimental"
