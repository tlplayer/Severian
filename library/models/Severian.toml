[package]
name = "models"
version = "0.1.0"
edition = "2026"
description = "Mathematical model notation built on Severian tensor kernels"

[lib]
path = "src/lib.sev"

[dependencies]
tensor = { path = "../tensor", version = "0.1.0" }

[package.metadata.library]
category = "machine-learning"
implementation = "source"
status = "experimental"

# Symbol packs are package-owned notation. The frontend reads this table instead
# of carrying a list of model names in Rust.
[package.metadata.compiler.symbols]
Relu = "activation"
LeakyRelu = "leakyActivation"
FastSigmoid = "sigmoidActivation"
FastTanh = "tanhActivation"
Gelu = "geluActivation"
Swish = "swishActivation"
J = "activationJacobian"

# Model notation aliases tensor-owned operations. The tensor package owns the
# executable fusion contract and opcode mapping.
[package.metadata.compiler.fusion-aliases]
activation = "tensor.relu"
sigmoidActivation = "tensor.fastSigmoid"
tanhActivation = "tensor.fastTanh"
geluActivation = "tensor.gelu"
swishActivation = "tensor.swish"

# These semantic roles let the compiler optimize model graphs without baking
# the public `models` API names into a compiler pass.
[package.metadata.compiler.graph-operations]
graphInput = "input"
graphRelu = "relu"
graphAdd = "add"
graphMatmul = "matmul"
graphTranspose = "transpose"
graphScale = "scale"
graphSoftmaxRows = "softmax-rows"
graphLayerNorm = "layer-norm"
runGraph = "run"
