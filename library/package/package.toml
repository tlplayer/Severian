[package]
name = "package"
version = "0.1.0"
edition = "2026"
description = "Source-owned package discovery, resolution, planning and distribution"

[lib]
path = "src/lib.sev"

[dependencies]
environment = { path = "../system/environment" }
file = { path = "../system/file" }
path = { path = "../system/path" }
process = { path = "../system/process" }
os = { path = "../system/os" }

[package.unsafe]
capabilities = ["native-abi"]
sources = ["src/host.sev"]
