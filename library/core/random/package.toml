[package]
name = "random"
version = "0.1.0"
edition = "2026"
description = "Deterministic pseudo-random generation"

[package.unsafe]
capabilities = ["native-abi"]
sources = ["src/ffi.sev"]

[lib]
path = "src/lib.sev"

[[ffi.c]]
name = "random-c"
abi = "c-v1"
targets = ["linux", "macos"]
sources = ["extern/c/random.c"]
include = ["extern/c/include"]
libraries = []

[package.metadata.library]
category = "numerics"
implementation = "native-abi"
status = "experimental"
