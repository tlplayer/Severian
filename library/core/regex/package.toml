[package]
name = "regex"
version = "0.1.0"
edition = "2026"
description = "Regular-expression compilation and matching"

[package.unsafe]
capabilities = ["native-abi"]
sources = ["src/ffi.sev"]

[lib]
path = "src/lib.sev"

[dependencies]
abi = { path = "../../interop/abi", version = "0.1.0" }

[[ffi.c]]
name = "regex-posix"
abi = "c-v1"
targets = ["linux", "macos"]
sources = ["extern/posix/regex.c"]
include = ["extern/include"]
libraries = []

[package.metadata.library]
category = "text-processing"
implementation = "native-abi"
status = "experimental"
