[package]
name = "matrix"
version = "0.1.0"
edition = "2026"
description = "Compiler-backed matrix notation and constructors"

[lib]
path = "src/lib.sev"

[package.metadata.library]
category = "numerics"
implementation = "source-and-compiler-contracts"
status = "experimental"

[package.metadata.compiler]
symbols = { X = "multiply", "^" = "cross", I = "identity", J = "jacobianMatrix" }
