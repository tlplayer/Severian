[package]
name = "file"
version = "0.1.0"
edition = "2026"
description = "Trait-backed file format dispatch and file operations"

[package.unsafe]
capabilities = ["native-abi"]
sources = ["src/ffi.sev"]

[lib]
path = "src/lib.sev"

[dependencies]
abi = { path = "../abi", version = "0.1.0" }
csv = { path = "../csv", version = "0.1.0" }
ffi = { path = "../ffi", version = "0.1.0" }
platform = { path = "../platform", version = "0.1.0" }
json = { path = "../json", version = "0.1.0" }
yaml = { path = "../yaml", version = "0.1.0" }

[[ffi.c]]
name = "file-posix"
abi = "c-v1"
targets = ["linux", "macos"]
sources = ["native/posix/file.c"]
include = ["native/include"]
libraries = []

[package.metadata.library]
category = "files-io"
implementation = "native-abi"
status = "experimental"
