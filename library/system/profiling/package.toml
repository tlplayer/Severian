[package]
name = "profiling"
version = "0.1.0"
edition = "2026"
description = "Structured native records emitted by with/without hook contexts"

[lib]
path = "src/lib.sev"

[dependencies]
process = { path = "../process", version = "0.1.0" }
storage = { package = "core.storage", path = "../../core/storage", version = "0.1.0" }
memory = { package = "core.memory", path = "../../core/memory", version = "0.1.0" }

[package.unsafe]
capabilities = ["native-abi"]
sources = ["src/measurement.sev"]
