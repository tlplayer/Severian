# Executable package/configuration example. Structural package fields select
# source targets; compiler settings use the catalog printed by
# `sev config defaults`.

[package]
name = "05-building"
version = "0.1.0"
edition = "2026"
publish = false
default-run = "05-building"

[[bin]]
name = "05-building"
path = "src/main.sev"

[lib]
name = "building"
path = "src/lib.sev"

[dependencies]

[dev-dependencies]

[language]
type-safe = true

[build]
profile = "dev"
backend = "auto"
target = "host"
incremental = true

[diagnostics]
mode = "user"
message-format = "text"
max-errors = 50
verify-each = false

[profile.dev]
opt-level = 0
debug-symbols = true
strip = false
lto = false

[profile.release]
opt-level = 3
debug-symbols = false
strip = true
lto = true

[test]
coverage-min = 0
memory-max = "4GB"
leaks = "allow"

[publish]
registry = "default"
include-source = true
include-interface = true
