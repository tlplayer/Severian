[[snippet]]
id = "prelude.smoke"
covers = ["prelude.surface"]
source = '''
def prelude_surface(values: list[int]) -> int:
    assert(size(values) >= 0)
    for index in range(0, int(size(values))):
        print(values[index])
    return int(size(values))
'''
