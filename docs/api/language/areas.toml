[[snippet]]
id = "language.areas"
covers = ["language.area"]
source = '''
def choose[T](value: T | None, fallback: T) -> T:
    if value == None:
        return fallback
    return value

test "language area smoke":
    assert(choose[int](None, 4) == 4)
'''
