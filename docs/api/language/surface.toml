[[snippet]]
id = "surface.literals"
covers = ["literal.kind"]
source = '''
def literals() -> bool:
    return 42 > 0 and 3.5 > 0.0 and true and 'x' == 'x' and "text" != ""
'''

[[snippet]]
id = "surface.expressions"
covers = ["expression.kind"]
source = '''
def expressions(values: list[int]) -> int:
    chosen = values[0] if size(values) > 0 else 0
    return chosen + 1
'''

[[snippet]]
id = "surface.statements"
covers = ["statement.kind"]
source = '''
def statements(values: list[int]) -> int:
    total := 0
    for value in values:
        if value < 0:
            continue
        total += value
    return total
'''

[[snippet]]
id = "surface.declarations"
covers = ["declaration.item"]
source = '''
trait Identity[T]:
    def identity(value: T) -> T

def identity[T](value: T) -> T:
    return value
'''

[[snippet]]
id = "surface.conversions"
covers = ["conversion.kind"]
source = '''
def conversions(value: i32) -> i64:
    return i64(value)
'''

[[snippet]]
id = "surface.types"
covers = ["type.annotation"]
source = '''
def union(value: int | None) -> int | None:
    return value
'''
