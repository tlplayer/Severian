[[feature]]
id = "literal.kind"
kind = "literal_family"
syntax = "integer | float | boolean | character | string | bytes | None | unit"
members = [
  { id = "literal.integer", syntax = "42", universal = "LiteralKind.Integer" },
  { id = "literal.float", syntax = "3.5", universal = "LiteralKind.Float" },
  { id = "literal.boolean", syntax = "true | false", universal = "LiteralKind.Boolean" },
  { id = "literal.character", syntax = "'x'", universal = "LiteralKind.Character" },
  { id = "literal.string", syntax = "\"text\"", universal = "LiteralKind.String" },
  { id = "literal.bytes", syntax = "b\"bytes\"", universal = "LiteralKind.Bytes" },
  { id = "literal.none", syntax = "None", universal = "LiteralKind.None" },
  { id = "literal.unit", syntax = "()", universal = "LiteralKind.Unit" },
]
type_params = ["T"]
parameters = ["source spelling"]
constraints = ["the spelling is valid for its literal kind", "semantic analysis selects a compatible T"]
returns = "T"
effects = []
errors = ["InvalidLiteral", "LiteralOutOfRange"]
ownership = "Literal values produce owned values; primitive copy behavior follows T."
universal = "LiteralKind"
lowering = "LiteralValue preserved until semantic type selection, then representation-correct constant lowering"
status = "implemented"
since = "2026"
tests = ["compiler/universal/src/literal.rs", "compiler/frontend/parser/src/tests.rs"]
examples = ["docs/examples/01-types/01-basic/01-primitives.sev"]
limitations = ["Measured literals are an AST spelling resolved to a measured primitive rather than a separate Universal LiteralKind."]
snippets = ["surface.literals"]

