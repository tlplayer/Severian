[[feature]]
id = "generic.function"
kind = "declaration"
syntax = "def name[T, U](...) -> R"
type_params = ["T", "U", "R"]
parameters = ["arguments: values parameterized by T/U"]
constraints = ["generic arity matches explicit arguments", "all substitutions satisfy declaration constraints"]
returns = "R"
effects = []
errors = ["GenericArityMismatch", "UnsatisfiedConstraint", "AmbiguousOverload"]
ownership = "Substitution preserves the declared ownership contract of every parameter and result."
universal = "GenericParameter(Type) + Substitution"
lowering = "HIR call identity plus substitution; no type suffix in the symbol"
status = "partial"
since = "2026"
tests = ["docs/examples/01-types/04-generics/01-generic-numeric.sev"]
examples = ["docs/examples/01-types/04-generics/README.md"]
limitations = ["Dependency interfaces do not yet expose every generic body/enum constructor consistently to downstream self-hosted packages."]
snippets = ["generics.identity"]

[[feature]]
id = "generic.dimension"
kind = "generic_parameter"
syntax = "D: dim"
type_params = ["D"]
parameters = ["D: compile-time or runtime dimension expression"]
constraints = ["D >= 0", "dimension arithmetic uses exact checked operations"]
returns = "D"
effects = []
errors = ["DimensionOverflow", "DivisionByZero", "NonExactDivision", "ConflictingDimensionParameter"]
ownership = "Dimension values are immutable compiler data."
universal = "GenericParamKind.Dimension + DimExpr"
lowering = "Static affine/index value or runtime shape operand"
status = "implemented"
since = "2026"
tests = ["compiler/universal/src/generic.rs"]
examples = ["docs/examples/08-numerics/06-shapes.sev"]
limitations = []
snippets = ["generics.identity"]

[[feature]]
id = "generic.shape"
kind = "generic_parameter"
syntax = "S...: shape"
type_params = ["S..."]
parameters = ["S...: ordered dimension sequence"]
constraints = ["rank is the length of S...", "named dimensions preserve equality"]
returns = "Shape[S...]"
effects = []
errors = ["ShapeArityMismatch", "ConflictingDimensionParameter"]
ownership = "Shape values are immutable compiler data."
universal = "GenericParamKind.Shape + ShapeTerm"
lowering = "Ranked tensor contract plus runtime dimension operands where required"
status = "partial"
since = "2026"
tests = ["compiler/universal/src/generic.rs"]
examples = ["docs/examples/08-numerics/06-shapes.sev"]
limitations = ["The complete source spelling and downstream dependency-interface contract are not yet conformance-tested across packages."]
snippets = ["generics.identity"]

[[feature]]
id = "generic.type_application"
kind = "expression"
syntax = "callee[T, D, S...](arguments...)"
type_params = ["T", "D", "S..."]
parameters = ["callee: generic callable", "arguments: value arguments"]
constraints = ["generic kinds and arity match", "ordinary overload resolution selects one callable"]
returns = "callee result after substitution"
effects = ["effects(callee)"]
errors = ["UnknownGeneric", "GenericKindMismatch", "AmbiguousOverload"]
ownership = "The applied callable controls argument moves/borrows and result ownership."
universal = "ResolvedCallee + Substitution"
lowering = "Specialize complete HIR body before MIR lowering"
status = "partial"
since = "2026"
tests = ["docs/examples/01-types/04-generics/04-boxed-generic.sev"]
examples = ["docs/examples/01-types/04-generics/README.md"]
limitations = ["Cross-package body preservation remains incomplete for some self-hosted compiler declarations."]
snippets = ["generics.identity"]

[[snippet]]
id = "generics.identity"
covers = ["generic.function", "generic.dimension", "generic.shape", "generic.type_application"]
source = '''
import tensor

def identity[T](value: T) -> T:
    return value

def preserve[T: tensor.TensorElement, *S: tensor.Dim](value: Tensor[T, *S]) -> Tensor[T, *S]:
    return value

test "generic application preserves type and shape":
    assert(identity[int](42) == 42)
'''
