[[snippet]]
id = "library.tensor.smoke"
covers = ["library.tensor"]
source = '''
import tensor

def tensor_surface[T: tensor.TensorElement, *S: tensor.Dim](left: Tensor[T, *S], right: Tensor[T, *S]) -> Tensor[T, *S]:
    return tensor.relu(tensor.add(left, right))
'''
