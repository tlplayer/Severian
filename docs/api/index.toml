specification_version = 1
root = "docs/api"
edition = "2026"
schema = "schema/feature.schema.json"
record_globs = [
  "language/**/*.toml",
  "compiler/**/*.toml",
  "library/**/*.toml",
  "prelude/**/*.toml",
]
documents = ["README.md", "APPENDIX.md", "SYMMETRY.md", "WEAKNESSES.md"]
statuses = ["specified", "implemented", "partial", "experimental", "deprecated", "unavailable"]

[editor]
declarations = ["def", "class", "trait", "enum", "extend", "type", "property", "operator", "extern"]
control = ["if", "else", "while", "for", "in", "match", "case", "return", "break", "continue", "pass", "when", "always", "try", "catch", "throw", "unsafe", "defer", "with", "select", "limit"]
imports = ["import", "from", "as"]
concurrency = ["async", "await", "send", "parallel", "distributed", "tasks", "simd", "simt", "gpu"]
ownership = ["view", "borrow", "clone", "move", "mut", "drop", "copy", "lock"]
testing = ["test", "compiler", "accept", "reject", "property", "bench", "chaos", "integ", "profile", "differential", "timeout", "skip", "repeat", "mock"]
logical = ["and", "or", "not", "is"]
constants = ["true", "false", "None", "absent", "invalid", "dynamic", "self", "runtime"]
primitive_types = ["bool", "char", "int", "i8", "i16", "i32", "i64", "i128", "isize", "u8", "u16", "u32", "u64", "u128", "usize", "float", "f8e4m3fn", "f8e5m2", "f16", "bf16", "f32", "f64", "f80", "f128", "string", "bytes", "Error", "None", "unit", "args", "data_size", "duration", "data_rate", "frequency", "percentage", "temperature", "voltage", "current", "power"]
builtin_types = ["Any", "Tensor", "Result", "TestResult", "Option", "Function", "Channel", "Buffer", "Path", "pointer", "list", "map", "set", "tuple"]
builtin_functions = ["assert", "panic", "exception", "print", "range", "size", "enumerate", "zip", "indices", "present", "throws"]
operators = ["?=", ":=", "==", "!=", "<=", ">=", "->", "+=", "-=", "*=", "/=", "%=", "**", "..", "...", "=", "+", "-", "*", "/", "%", "<", ">", "|", "&", "^", "@"]

[coverage]
required_feature_ids = [
  "generic.function",
  "generic.dimension",
  "generic.shape",
  "generic.type_application",
  "type.tensor",
  "operator.unary",
  "operator.binary",
  "tensor.elementwise",
  "tensor.reduce",
  "tensor.matmul",
  "tensor.reshape_view",
  "tensor.permute",
  "tensor.slice",
  "tensor.broadcast",
  "tensor.gather",
  "tensor.scatter",
  "tensor.concatenate",
  "tensor.convert",
  "tensor.storage_view",
]
