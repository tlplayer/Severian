[[snippet]]
id = "tensor.structural"
covers = ["tensor.elementwise", "tensor.reduce", "tensor.matmul", "tensor.reshape_view", "tensor.permute", "tensor.slice", "tensor.broadcast", "tensor.gather", "tensor.scatter", "tensor.concatenate", "tensor.convert", "tensor.storage_view"]
source = '''
import tensor

def structural[T: tensor.TensorElement, *S: tensor.Dim, *I: tensor.Dim](
    left: Tensor[T, *S],
    right: Tensor[T, *S],
    indices: Tensor[i64, *I],
):
    added = tensor.add(copy left, copy right)
    reduced = tensor.sum(copy added)
    product = tensor.matmul(copy added, copy right)
    shaped = tensor.reshape(product, tensor.shape(copy left))
    selected = tensor.gather(copy shaped, copy indices)
    updated = tensor.scatter(shaped, indices, selected)
    return tensor.convert_like(updated, left)
'''
