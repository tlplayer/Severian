[[feature]]
id = "tensor.elementwise"
kind = "compiler_operation"
syntax = "Elementwise[O](inputs...)"
type_params = ["T", "S...", "O"]
parameters = ["inputs: Tensor[T, S...]", "O: add, subtract, multiply, divide, exp, log, sin, tanh, rsqrt, relu, scale, or add_scalar"]
constraints = ["rank is known at rank-dependent emission", "broadcasting and element legality are proven before lowering"]
returns = "Tensor[R, S...]"
effects = []
errors = ["UnknownRank", "IncompatibleShape", "UnsupportedElementRepresentation"]
ownership = "Produces a new logical value; fusion may elide intermediate storage without changing alias semantics."
universal = "tensor.elementwise"
lowering = "linalg.generic/arith on CPU; fused blocked elementwise GPU MLIR where supported"
status = "partial"
since = "2026"
tests = ["compiler/universal/src/tensor.rs", "docs/examples/08-numerics/15-tensor-exhaustive.sev"]
examples = ["docs/examples/08-numerics/05-tensor.sev"]
limitations = ["GPU lowering currently covers only the initial blocked elementwise slice; the complete representation matrix is not implemented."]
snippets = ["tensor.structural"]
backend_status = { cpu = "partial", amd = "experimental", nvidia = "experimental" }

