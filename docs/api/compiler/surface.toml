[[feature]]
id = "compiler.surface"
kind = "compiler_extension_family"
syntax = "compiler policy or backend contract"
members = [
  { id = "compiler.compile_type", syntax = "CompileType", universal = "universal::CompileRoute and compile type registry" },
  { id = "compiler.hook", syntax = "def hook(...) with context", universal = "ast::HookSpecification" },
  { id = "compiler.directive.compile", syntax = "@compile(route)", universal = "ast::Decorator compile policy" },
  { id = "compiler.directive.mlir", syntax = "@mlir", universal = "ast::Decorator compile policy" },
  { id = "compiler.directive.stablehlo", syntax = "@stablehlo", universal = "ast::Decorator compile policy" },
  { id = "compiler.backend.cpu_mlir", syntax = "target CPU", universal = "CompiledRegionArtifact::CpuMlir" },
  { id = "compiler.backend.gpu_mlir", syntax = "target AMD|NVIDIA", universal = "CompiledRegionArtifact::GpuKernel" },
  { id = "compiler.backend.xla", syntax = "target XLA", universal = "CompileRoute::Xla" },
]
type_params = ["Input", "Output"]
parameters = ["typed compiler IR and target contract"]
constraints = ["the selected route is legal for the operation, types, shapes, effects, and target"]
returns = "backend-neutral artifact or target artifact"
effects = ["compiler process only"]
errors = ["UnsupportedCompileRoute", "IllegalBackendOperation", "BackendDiagnostic"]
ownership = "Compiler artifacts own their bytes and launch metadata; source ownership semantics remain unchanged."
universal = "CompileRoute + compile protocol"
lowering = "structural backend routing"
status = "partial"
since = "2026"
tests = ["compiler/compile/src", "compiler/boundaries/driver/src"]
examples = ["docs/examples"]
limitations = ["GPU scheduling and complete launcher execution remain under development."]
snippets = ["compiler.policy"]

[[snippet]]
id = "compiler.policy"
covers = ["compiler.surface"]
source = '''
@compile("mlir")
def compiled_add(left: i32, right: i32) -> i32:
    return left + right
'''
