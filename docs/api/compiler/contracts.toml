[[feature]]
id = "compiler.contract"
kind = "compiler_contract_family"
syntax = "structural compiler data"
members = [
  { id = "compiler.target.spec", syntax = "TargetSpec", universal = "severian_target::TargetSpec" },
  { id = "compiler.target.architecture", syntax = "Architecture", universal = "severian_target::Architecture" },
  { id = "compiler.target.operating_system", syntax = "OperatingSystem", universal = "severian_target::OperatingSystem" },
  { id = "compiler.target.device", syntax = "Device", universal = "severian_target::Device" },
  { id = "compiler.target.execution_backend", syntax = "ExecutionBackend", universal = "severian_target::ExecutionBackend" },
  { id = "compiler.compile.region", syntax = "CompileRegion", universal = "severian_compile::CompileRegion" },
  { id = "compiler.compile.value_contract", syntax = "CompileValueContract", universal = "severian_compile::CompileValueContract" },
  { id = "compiler.compile.tensor_contract", syntax = "TensorValueContract", universal = "severian_compile::TensorValueContract" },
  { id = "compiler.compile.specialization", syntax = "CompileRegionSpecialization", universal = "severian_compile::CompileRegionSpecialization" },
  { id = "compiler.artifact.region", syntax = "CompiledRegionArtifact", universal = "severian_compile::CompiledRegionArtifact" },
  { id = "compiler.artifact.cpu_mlir", syntax = "CpuMlir(MlirArtifact)", universal = "CompiledRegionArtifact::CpuMlir" },
  { id = "compiler.artifact.gpu_kernel", syntax = "GpuKernel(GpuKernelBundle)", universal = "CompiledRegionArtifact::GpuKernel" },
  { id = "compiler.artifact.tensor_jit", syntax = "TensorJit(TensorJitBundle)", universal = "CompiledRegionArtifact::TensorJit" },
  { id = "compiler.pass.contract", syntax = "PassContract", universal = "severian_mir::PassContract" },
  { id = "compiler.pass.invariant", syntax = "InvariantSet", universal = "severian_mir::InvariantSet" },
  { id = "compiler.pass.entity_change", syntax = "may_remove | may_introduce", universal = "severian_mir::EntitySet" },
  { id = "compiler.runtime.storage_view", syntax = "StorageViewAbi", universal = "runtime StorageViewAbi" },
  { id = "compiler.runtime.kernel_specialization", syntax = "KernelSpecialization", universal = "severian_fusion::KernelSpecialization" },
  { id = "compiler.runtime.launcher", syntax = "compiled launcher", universal = "severian_runtime tensor JIT provider and cache" },
]
type_params = ["Input...", "Output...", "T", "S...", "D..."]
parameters = ["structural IR, value contracts, target data, and optional runtime specialization"]
constraints = ["each region selects exactly one legal route", "rank-dependent emission receives known rank", "dtype and rank remain data, never symbol suffixes"]
returns = "verified backend-neutral or target artifact"
effects = ["compiler allocation", "cache mutation", "device discovery and launch only at runtime boundaries"]
errors = ["CompileError", "RegionSpecializationError", "TargetError", "backend diagnostics"]
ownership = "Artifacts own emitted bytes and graphs; storage views borrow or own buffers according to their ABI descriptor."
universal = "compile planning, target authority, pass contracts, artifact routing, and runtime specialization"
lowering = "MIR region -> verified route -> CPU MLIR or Severian GPU MLIR; unresolved rank may defer to the small executable Tensor-JIT"
status = "partial"
since = "2026"
tests = ["compiler/compile/src", "compiler/transforms/mir/src", "compiler/transforms/mlir/src", "compiler/runtime/src"]
examples = ["library/compute/tensor/examples"]
limitations = ["GPU machine-code coverage and fully unranked end-to-end model execution remain incomplete; deprecated Triton compatibility values are not active compilation routes."]
snippets = ["compiler.contracts"]

[[snippet]]
id = "compiler.contracts"
covers = ["compiler.contract"]
source = '''
@compile("mlir")
def structural_add[T, *S: Dim](left: Tensor[T, *S], right: Tensor[T, *S]) -> Tensor[T, *S]:
    return left + right
'''
