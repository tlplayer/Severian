[workspace]
members = ["library"]

[build]
pipeline = [
    "format",
    "lint",
    "compile",
    "architecture",
    "test",
    "profile",
    "coverage",
    "memory",
    "integration",
]

[coverage]
minimum = 99
regions = 99
branches = 99
functions = 99
per_file = true
exclude = ["library/network/src/lib.sev"]

[memory]
leaks = "deny"

[compiler.type_resolution]
deny_any = true
deny_tensor_any = true
deny_unresolved = true
deny_inferred_fallback = true
deny_lost_type_information = true

[architecture]
enforce = true
deny_cycles = true
deny_unknown_layers = true
deny_layer_violations = true

[architecture.layers]
include = ["compiler/*"]
order = [
    "abi",
    "ast",
    "build",
    "coverage",
    "dtype",
    "mlir",
    "platform",
    "runtime",
    "lexer",
    "hir",
    "model-ir",
    "parser",
    "source",
    "package",
    "diagnostics",
    "semantic",
    "mir",
    "ownership",
    "passes",
    "xla",
    "lowering",
    "backend",
    "driver",
]

[[architecture.rule]]
from = "compiler/hir/**"
allow = ["compiler/abi/**", "compiler/dtype/**"]

[[architecture.rule]]
from = "compiler/package/**"
allow = ["compiler/abi/**"]

[[architecture.rule]]
from = "compiler/semantic/**"
allow = [
    "compiler/abi/**",
    "compiler/ast/**",
    "compiler/hir/**",
    "compiler/package/**",
]

[[architecture.rule]]
from = "compiler/mir/**"
allow = ["compiler/hir/**"]

[[architecture.rule]]
from = "compiler/lowering/**"
allow = [
    "compiler/abi/**",
    "compiler/coverage/**",
    "compiler/hir/**",
    "compiler/mir/**",
    "compiler/mlir/**",
    "compiler/platform/**",
    "compiler/source/**",
]

[[architecture.rule]]
from = "compiler/backend/**"
allow = [
    "compiler/abi/**",
    "compiler/hir/**",
    "compiler/lowering/**",
    "compiler/mlir/**",
    "compiler/package/**",
]

[architecture.files]
soft_lines = 500
hard_lines = 800
include = [
    "compiler/**/*.rs",
    "library/**/*.sev",
    "docs/**/*.sev",
    "bench/**/*.sev",
    "benchmarks/**/*.sev",
]

[[architecture.files.exception]]
path = "compiler/lowering/src/core/expression.rs"
hard_lines = 3000
reason = "The first lowering split isolated expression lowering; the next pass must split expression families without destabilizing typed lowering."
expires = "2026-10-15"
owner = "compiler-lowering"

[[architecture.files.exception]]
path = "compiler/lowering/src/core/bridge.rs"
hard_lines = 2100
reason = "Generated native ABI bridge fragments are isolated from lowering, but still need extraction into reviewed runtime templates."
expires = "2026-10-15"
owner = "compiler-runtime"

[[architecture.files.exception]]
path = "compiler/driver/src/main.rs"
hard_lines = 2700
reason = "The build policy is now isolated in driver modules; remaining command dispatch must move into command-specific modules."
expires = "2026-10-15"
owner = "compiler-driver"

[[architecture.files.exception]]
path = "compiler/diagnostics/src/naming.rs"
hard_lines = 1100
reason = "Naming diagnostics remain grouped while their shared traversal state is extracted."
expires = "2026-10-15"
owner = "compiler-diagnostics"

[[architecture.files.exception]]
path = "library/model/src/lib.sev"
soft_lines = 800
hard_lines = 1000
reason = "The compatibility model facade must keep its exported declarations in the package root until public module re-exports land; implementation is already split into focused source modules."
expires = "2026-09-30"
owner = "model-runtime"
