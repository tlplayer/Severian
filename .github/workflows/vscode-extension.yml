name: vscode-extension

on:
  push:
    paths:
      - "editors/vscode/**"
      - "compiler/lexer/src/lib.rs"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - "compiler/lexer/src/lib.rs"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this version to the public VS Code Marketplace"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packager
        run: npm install --ignore-scripts

      - name: Check grammar
        run: npm run check

      - name: Package VSIX
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: severian-language-vsix
          path: editors/vscode/severian-language.vsix

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish -- --pat "$VSCE_PAT"
