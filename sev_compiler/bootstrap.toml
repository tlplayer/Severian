[mirror]
source = "../compiler"
source-extension = "rs"
bootstrap-extension = "sev"
manifest = "package.toml"
require-directory-parity = true
require-file-parity = true
require-package-parity = true

[acceptance]
canonical-examples = "../docs/examples"
validation-package = "../test/validation/examples"
required-commands = ["check", "build", "run", "test", "coverage"]
allow-skips = false
allow-source-rewrites = false
require-backend-route-parity = true

[[stage]]
compiler = "sev0"
produced-by = "rust"
build = "sev0 build sev_compiler --output target/bootstrap/stage1/sev"
validation = "sev0 test test/validation/examples"

[[stage]]
compiler = "sev1"
produced-by = "sev0"
build = "target/bootstrap/stage1/sev build sev_compiler --output target/bootstrap/stage2/sev"
validation = "target/bootstrap/stage1/sev test test/validation/examples"

[[stage]]
compiler = "sev2"
produced-by = "sev1"
build = "target/bootstrap/stage2/sev build sev_compiler --output target/bootstrap/stage3/sev"
validation = "target/bootstrap/stage2/sev test test/validation/examples"
fixed-point-with = "sev3"

[[stage]]
compiler = "sev3"
produced-by = "sev2"
validation = "target/bootstrap/stage3/sev test test/validation/examples"
fixed-point-with = "sev2"
