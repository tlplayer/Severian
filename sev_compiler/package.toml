# Severian package manifest.
# Generated from the compiler-owned configuration catalog.

### PACKAGE ############################################################

[package]
name = "sev_compiler"
version = "0.1.0"
edition = "2026"
license = "Severian License"
default-run = "sev_compiler"

[package.metadata.pipeline]
sections = "00-getting-started,01-types,02-functions,03-testing"
timeout-seconds = "30"
memory-bytes = "3000000000"
compiler-timeout-seconds = "180"
compiler-memory-bytes = "3000000000"
compiler-profile = "release"

### TARGETS ############################################################

[[bin]]
name = "sev_compiler"
path = "src/main.sev"

[[bin]]
name = "compiler-pipeline"
path = "pipeline.sev"

# [lib]
# name = "sev_compiler"
# path = "src/lib.sev"

### DEPENDENCIES #######################################################

[dependencies]
profiling = { path = "../library/system/profiling" }
time = { path = "../library/core/time" }
package = { path = "../library/package" }
diagnostics = { path = "diagnostics" }
lexer = { path = "frontend/lexer" }
parser = { path = "frontend/parser" }
source = { path = "source" }
universal = { path = "universal" }

[xxi.c]
build-info = "__sev_compiler_build_info"

[dev-dependencies]

### LANGUAGE ############################################################

[language]
type-safe = true

### BUILD ###############################################################

[build]
profile = "dev"
target = "host"
incremental = true

### DIAGNOSTICS #########################################################

[diagnostics]
mode = "user"
message-format = "text"
max-errors = 5
verify-each = false

### DEVELOPMENT PROFILE #################################################

[profile.dev]
opt-level = 0
debug-symbols = true
strip = false
lto = false

### RELEASE PROFILE #####################################################

[profile.release]
opt-level = 3
debug-symbols = false
strip = true
lto = true

### TESTING #############################################################

[test]
coverage-min = 0
memory-max = "4GB"
# The example-suite executable runs many individually guarded pipeline steps.
timeout-seconds = 1800
leaks = "deny"

### PUBLISHING ##########################################################

[publish]
registry = "default"
include-source = true
include-interface = true
