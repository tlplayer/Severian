[package]
name = "severian-driver"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
severian-ast = { path = "../../frontend/ast" }
severian-abi = { path = "../abi" }
severian-backend = { path = "../backend" }
severian-bootstrap = { path = "../../bootstrap" }
severian-compile = { path = "../../compile" }
severian-diagnostics = { path = "../../diagnostics" }
severian-ffi = { path = "../ffi" }
severian-lexer = { path = "../../frontend/lexer" }
severian-hir = { path = "../../frontend/hir" }
severian-modules = { path = "../../frontend/modules" }
severian-lowering = { path = "../../transforms/lowering" }
severian-mir = { path = "../../transforms/mir" }
severian-mlir = { path = "../../transforms/mlir" }
severian-ownership = { path = "../../frontend/ownership" }
severian-parser = { path = "../../frontend/parser" }
severian-semantic = { path = "../../frontend/semantic" }
severian-source = { path = "../../source" }
severian-target = { path = "../../target" }
severian-universal = { path = "../../universal" }
severian-xxi = { path = "../xxi" }
toml = "0.8"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sev"
path = "src/main.rs"
