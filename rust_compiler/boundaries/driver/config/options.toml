# Canonical configuration catalog for `sev`. Defaults, validation, generated
# manifests, configuration synchronization, and CLI help consume this file.

[[option]]
path = "language.type-safe"
group = "Language"
type = "bool"
default = "true"
description = "Require statically verified source types."

[[option]]
path = "build.profile"
group = "Build"
type = "enum"
default = "dev"
values = ["dev", "release"]
description = "Build profile selection."

[[option]]
path = "build.target"
group = "Build"
type = "string"
default = "host"
description = "Host, target triple, or device selected for the build."

[[option]]
path = "build.incremental"
group = "Build"
type = "bool"
default = "true"
description = "Reuse compatible work from earlier builds."

[[option]]
path = "diagnostics.mode"
group = "Diagnostics"
type = "enum"
default = "user"
values = ["user", "developer"]
description = "Diagnostic detail policy."

[[option]]
path = "diagnostics.message-format"
group = "Diagnostics"
type = "enum"
default = "text"
values = ["text", "json"]
description = "Diagnostic output format."

[[option]]
path = "diagnostics.max-errors"
group = "Diagnostics"
type = "integer"
default = "5"
description = "Maximum diagnostics emitted before checking stops."

[[option]]
path = "diagnostics.verify-each"
group = "Diagnostics"
type = "bool"
default = "false"
description = "Verify every compiler stage in developer workflows."

[[option]]
path = "profile.dev.opt-level"
group = "Development Profile"
type = "integer"
default = "0"
description = "Optimization level for development builds."

[[option]]
path = "profile.dev.debug-symbols"
group = "Development Profile"
type = "bool"
default = "true"
description = "Emit debug symbols for development builds."

[[option]]
path = "profile.dev.strip"
group = "Development Profile"
type = "bool"
default = "false"
description = "Strip development artifacts."

[[option]]
path = "profile.dev.lto"
group = "Development Profile"
type = "bool"
default = "false"
description = "Enable link-time optimization for development builds."

[[option]]
path = "profile.release.opt-level"
group = "Release Profile"
type = "integer"
default = "3"
description = "Optimization level for release builds."

[[option]]
path = "profile.release.debug-symbols"
group = "Release Profile"
type = "bool"
default = "false"
description = "Emit debug symbols for release builds."

[[option]]
path = "profile.release.strip"
group = "Release Profile"
type = "bool"
default = "true"
description = "Strip release artifacts."

[[option]]
path = "profile.release.lto"
group = "Release Profile"
type = "bool"
default = "true"
description = "Enable link-time optimization for release builds."

[[option]]
path = "test.coverage-min"
group = "Testing"
type = "integer"
default = "91"
description = "Minimum accepted test coverage percentage."

[[option]]
path = "test.memory-max"
group = "Testing"
type = "string"
default = "4GB"
description = "Inherited address-space budget for source package test compilation and execution."

[[option]]
path = "test.timeout-seconds"
group = "Testing"
type = "integer"
default = "60"
description = "Wall-clock budget for source package test compilation and execution."

[[option]]
path = "test.leaks"
group = "Testing"
type = "enum"
default = "deny"
values = ["allow", "warn", "deny"]
description = "Memory leak policy for tests."

[[option]]
path = "publish.registry"
group = "Publishing"
type = "string"
default = "default"
description = "Registry used when publishing a package."

[[option]]
path = "publish.include-source"
group = "Publishing"
type = "bool"
default = "true"
description = "Include source in published package artifacts."

[[option]]
path = "publish.include-interface"
group = "Publishing"
type = "bool"
default = "true"
description = "Include stable interfaces in published package artifacts."

